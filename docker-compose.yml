services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itexam-backend
    volumes:
      - exam-data:/data
    expose:
      - "8000"
    environment:
      - DB_PATH=/data/exams.db
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itexam-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  exam-data:
    driver: local
