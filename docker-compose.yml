services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itexam-backend
    volumes:
      - exam-data:/data
    expose:
      - "8000"
    environment:
      - DB_PATH=/data/exams.db
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itexam-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

volumes:
  exam-data:
    driver: local
